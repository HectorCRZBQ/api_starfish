[tool.poetry]
name = "api-starfish"
version = "0.1.0"
description = "A API that makes the CRUD tasks about starfish"
authors = ["HectorCRZBQ <hectorcb3333@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
attrs = "24.2.0"
blinker = "1.8.2"
click = "8.1.7"
flask = "2.2.5"
flask-sqlalchemy = "3.1.1"
greenlet = "3.1.1"
iniconfig = "2.0.0"
itsdangerous = "2.2.0"
jinja2 = "3.1.4"
markupsafe = "3.0.1"
packaging = "24.1"
pluggy = "1.5.0"
py = "1.11.0"
pytest = "8.3.3"
pytest-flask = ">=1.2.0"
sqlalchemy = "2.0.35"
tomli = "2.0.2"
typing-extensions = "4.12.2"
werkzeug = "3.0.4"
flask-testing = "0.8.1"
coverage = "7.3.1"
locust = "2.31.8"
pylint = "3.3.1"
python-dotenv = "^1.0.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
